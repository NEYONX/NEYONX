<!DOCTYPE html>
<html>
<head>
<style>
body { margin:0; background:#000; }
img {
  width:100%;
  animation: sway 4s ease-in-out infinite;
  transform-origin: center bottom;
}
@keyframes sway {
  0% { transform: rotate(-1.5deg); }
  50% { transform: rotate(1.5deg); }
  100% { transform: rotate(-1.5deg); }
}
</style>
</head>
<body>
<img src="sunflower.png">
</body>
</html>
