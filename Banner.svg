<svg width="450" height="540" viewBox="0 0 450 540" xmlns="http://w3.org">
  <style>
    .flower-sway {
      transform-origin: 225px 200px;
      animation: sway 3.5s ease-in-out infinite;
    }
    .word {
      font-family: 'Courier New', Courier, monospace;
      font-size: 22px;
      font-weight: bold;
      display: inline-block;
      animation: bounce 1.8s ease-in-out infinite, two-colors 3s ease-in-out infinite;
    }
    .w1 { animation-delay: 0.0s; }
    .w2 { animation-delay: 0.2s; }
    .w3 { animation-delay: 0.4s; }
    .w4 { animation-delay: 0.6s; }
    .w5 { animation-delay: 0.8s; }
    .w6 { animation-delay: 1.0s; }
    .w7 { animation-delay: 1.2s; }

    @keyframes sway {
      0%, 100% { transform: rotate(-2deg) scale(1); }
      50% { transform: rotate(2deg) scale(1.02); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes two-colors {
      0%, 100% { fill: #f59e0b; }
      50% { fill: #ec4899; }
    }
  </style>

  <rect width="100%" height="100%" fill="#ffffff" rx="15" />

  <image class="flower-sway" href="./IMG_20261115_031840.png" x="45" y="20" width="360" height="360" />

  <text x="50%" y="420" text-anchor="middle">
    <tspan class="word w1">As </tspan>
    <tspan class="word w2">long </tspan>
    <tspan class="word w3">as</tspan>
  </text>
  <text x="50%" y="455" text-anchor="middle">
    <tspan class="word w4">we're </tspan>
    <tspan class="word w5">together,</tspan>
  </text>
  <text x="50%" y="490" text-anchor="middle">
    <tspan class="word w6">everything </tspan>
    <tspan class="word w7">is fun.</tspan>
  </text>
</svg>


  
